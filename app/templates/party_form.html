{% extends "base.html" %}{% block content %}
<h4>{{ 'Edit' if obj else 'Add' }} {{ title|lower }}</h4>
<form method="post" class="card p-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% for f, label in [('name','Name'),('contact_person','Contact person'),('phone','Phone'),('email','Email')] %}{% if f != 'contact_person' or is_supplier %}
<div class="mb-3"><label class="form-label">{{ label }}</label><input name="{{ f }}" class="form-control" value="{{ form.get(f, (obj|attr(f) or '') if obj else '') }}" {{ 'required' if f=='name' }}></div>{% endif %}{% endfor %}
<div class="mb-3"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2">{{ form.get('address', (obj.address or '') if obj else '') }}</textarea></div>
<div class="mb-3"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2">{{ form.get('notes', (obj.notes or '') if obj else '') }}</textarea></div>
<div class="d-flex gap-2"><button class="btn btn-primary">Save</button><a class="btn btn-outline-secondary" href="javascript:history.back()">Cancel</a></div></form>{% endblock %}
