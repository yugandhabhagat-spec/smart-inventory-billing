{% macro pager(page, endpoint) %}
{% if page.pages > 1 %}<div class="d-flex gap-2 align-items-center my-2">
{% if page.has_prev %}<a class="btn btn-sm btn-outline-secondary" href="{{ url_for(endpoint, **dict(request.args.to_dict(), page=page.prev_num)) }}">&laquo; Prev</a>{% endif %}
<span class="small">Page {{ page.page }} of {{ page.pages }}</span>
{% if page.has_next %}<a class="btn btn-sm btn-outline-secondary" href="{{ url_for(endpoint, **dict(request.args.to_dict(), page=page.next_num)) }}">Next &raquo;</a>{% endif %}
</div>{% endif %}{% endmacro %}
