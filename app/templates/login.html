{% extends "base.html" %}{% block content %}
<div class="row justify-content-center mt-5"><div class="col-12 col-sm-8 col-md-4"><div class="card p-4">
<h4 class="mb-3">{{ business_name }}</h4>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required autofocus autocomplete="username"></div>
<div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required autocomplete="current-password"></div>
<button class="btn btn-primary w-100">Sign in</button></form></div></div></div>{% endblock %}
