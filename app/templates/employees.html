{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2"><h4>Employees</h4><a class="btn btn-primary btn-sm" href="{{ url_for('employees.new_user') }}">Add employee</a></div>
<div class="table-responsive card"><table class="table table-sm mb-0 align-middle"><thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.full_name }}</td><td>{{ u.role }}</td><td>{{ 'Active' if u.active else 'Inactive' }}</td><td class="text-end">
<form method="post" action="{{ url_for('employees.toggle', uid=u.id) }}" class="d-inline" onsubmit="return confirm('Change account status?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-secondary">{{ 'Deactivate' if u.active else 'Activate' }}</button></form>
<form method="post" action="{{ url_for('employees.reset_password', uid=u.id) }}" class="d-inline-flex gap-1"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="password" type="password" minlength="10" class="form-control form-control-sm" placeholder="New password" required autocomplete="new-password"><button class="btn btn-sm btn-outline-primary">Reset</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
